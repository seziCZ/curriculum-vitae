<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview image</title>
<!-- Design for og-image.png (1200x630). scripts/make-images.mjs renders it with headless Chrome. -->
<style>
  @font-face { font-family:'Space Grotesk'; font-weight:300 700;
    src:url(/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2) format('woff2'); }
  @font-face { font-family:'Space Grotesk'; font-weight:300 700; unicode-range:U+0100-02BA;
    src:url(/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-ext-wght-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:300 700;
    src:url(/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2'); }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:#1c2030; }
  canvas { position:absolute; inset:0; }
  .panel { position:absolute; left:56px; bottom:56px; width:640px; background:#1c2030; padding:36px 40px; color:#e6d8ce; }
  .bar { display:flex; gap:6px; margin-bottom:22px; }
  .bar i { width:30px; height:8px; display:block; }
  h1 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:84px; line-height:.95; letter-spacing:-.02em; }
  .claim { margin-top:20px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:30px; line-height:1.25; }
  .sub { margin-top:14px; font-family:'Inter',sans-serif; font-size:21px; color:#b4b8c2; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="panel">
  <div class="bar"><i style="background:#b4634a"></i><i style="background:#6e8ba5"></i><i style="background:#dcc5ba"></i></div>
  <h1>Tomáš Sezima</h1>
  <p class="claim">I build the data platforms that products and AI agents run on.</p>
  <p class="sub">Data engineering on AWS and Databricks · Brno</p>
</div>
<script type="module">
  import { buildWall } from '/src/js/wall.js';
  import { drawTile } from '/src/js/draw.js';
  // Fixed seed, so the image is the same on every run.
  let seed = 7;
  const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ctx = document.getElementById('c').getContext('2d');
  const { tiles } = buildWall(1200, 630, rand);
  for (const tl of tiles) drawTile(ctx, 1, tl, [tl.size, 0, 0, tl.size, tl.hx, tl.hy], 1);
  await document.fonts.ready;
  document.title = 'ready';
</script>
</body>
</html>
